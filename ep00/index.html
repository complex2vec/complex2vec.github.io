<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The whole Transformer</title>
<style>
@font-face { font-family: STIX; src: url(fonts/STIXTwoText.ttf); font-weight: 400 700; }
@font-face { font-family: STIX; src: url(fonts/STIXTwoText-Italic.ttf); font-style: italic; font-weight: 400 700; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono.ttf); font-weight: 100 800; }
html, body { margin: 0; background: #010402; overflow: hidden; }
canvas { display: block; }
body.lab, body.fit { height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; }
body.lab canvas, body.fit canvas { width: min(100vw, calc(100vh * 9 / 16)); width: min(100vw, calc(100dvh * 9 / 16)); height: auto; }   /* fit 9:16 inside any screen, never stretched */
body.lab canvas { touch-action: none; cursor: pointer; }
body.fit canvas { cursor: pointer; }
#play { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 1.6vh; text-align: center; }
#play[hidden] { display: none; }
#play button { font: 600 clamp(15px, 2.2vh, 22px) JBM, monospace; color: #010402; background: #4DFF88; border: 0; border-radius: 1.2vh;
  padding: 1.6vh 3vh; box-shadow: 0 0 3vh #4DFF8866; cursor: pointer; }
#play button:focus-visible { outline: 2px solid #E6FFEC; outline-offset: 3px; }
#play a { font: 500 clamp(12px, 1.7vh, 17px) JBM, monospace; color: #8DFFB0; background: #010402e6; padding: .7vh 1.6vh; border-radius: 999px; }
#ui { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); width: min(92vw, 52vh); box-sizing: border-box;
  padding: 1.4vh 2vh; border: 1px solid #8DFFB044; border-radius: 1vh; background: #010402dd;
  font: 500 clamp(12px, 1.7vh, 18px) JBM, monospace; color: #8DFFB0; display: grid; gap: 1vh; }
#ui[hidden] { display: none; }
#ui label { display: flex; align-items: center; gap: 1.2vh; }
#ui select { flex: 1; min-width: 0; font: inherit; color: #E6FFEC; background: #0B2412; border: 1px solid #8DFFB066; border-radius: .6vh; padding: .4vh .6vh; }
#ui input[type=range] { flex: 1; accent-color: #4DFF88; }
#ui input[type=checkbox] { accent-color: #FFB547; width: 2vh; height: 2vh; }
#ui .v { min-width: 4ch; text-align: right; color: #E6FFEC; }
#ui a { color: #8DFFB0; opacity: .7; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="play" hidden><button id="playBtn" type="button">▶ Play with sound</button><a href="../">more episodes and labs →</a></div>
<script>
'use strict';
// ───────────────────────── constants and helpers ─────────────────────────
const W = 1080, H = 1920, QS = new URLSearchParams(location.search), LAB = QS.has('lab');
const COL = { bg: '#010402', amb: '#0B2412', beam: '#4DFF88', ui: '#8DFFB0', hot: '#E6FFEC', amber: '#FFB547' };
const G = { x0: 60, y0: 520, x1: 1020, y1: 1288, cx: 540, cy: 904 };          // the graticule on the glass (10 × 8 div of 96 px)
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => b > a ? clamp((t - a) / (b - a)) : (t >= a ? 1 : 0);
const ss = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eo = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const bo = x => { x = clamp(x); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };   // back-out: a small overshoot
const flash = (t, t0, d = .35) => t >= t0 ? clamp(1 - (t - t0) / d) : 0;
const F = { mono: (px, w = 500) => `${w} ${px}px JBM`, serif: (px, w = 400) => `${w} ${px}px STIX`, ital: (px, w = 400) => `italic ${w} ${px}px STIX` };
const fmtN = n => Math.round(n).toLocaleString('en-US');

// ───────────────────────── canvases: four light channels + glow ─────────────────────────
const X = document.getElementById('c').getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const [cBeam, BEAM] = mk(W, H), [cUi, UI] = mk(W, H), [cHot, HOT] = mk(W, H), [cAmb, AMB] = mk(W, H);
const [cGlow, GLOW] = mk(W / 2, H / 2);
const LEVELS = [[4, 1.2, .55], [8, 2.0, .45], [16, 2.6, .32], [32, 3.0, .22]].map(([ds, b, w]) => { const [c, x] = mk(W / ds, H / ds); return { c, x, b, w }; });
const [cBg, BG] = mk(W, H), [cVig, VIG] = mk(W, H);
(function screen() {
  BG.fillStyle = COL.bg; BG.fillRect(0, 0, W, H);
  let g = BG.createRadialGradient(540, 900, 0, 540, 900, 1250); g.addColorStop(0, 'rgba(11,36,18,.62)'); g.addColorStop(1, 'rgba(11,36,18,0)');
  BG.fillStyle = g; BG.fillRect(0, 0, W, H);
  g = VIG.createRadialGradient(540, 960, 520, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  VIG.fillStyle = g; VIG.fillRect(0, 0, W, H);
})();
function clearLayers() { for (const c of [BEAM, UI, HOT, AMB]) { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.clearRect(0, 0, W, H); } }
function compose() {
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1; X.drawImage(cBg, 0, 0);
  GLOW.globalCompositeOperation = 'source-over'; GLOW.globalAlpha = 1; GLOW.clearRect(0, 0, W / 2, H / 2);
  GLOW.drawImage(cBeam, 0, 0, W / 2, H / 2); GLOW.globalCompositeOperation = 'lighter';
  GLOW.globalAlpha = 1.25; GLOW.drawImage(cHot, 0, 0, W / 2, H / 2); GLOW.globalAlpha = .9; GLOW.drawImage(cAmb, 0, 0, W / 2, H / 2);
  GLOW.globalAlpha = .2; GLOW.drawImage(cUi, 0, 0, W / 2, H / 2); GLOW.globalAlpha = 1;
  X.globalCompositeOperation = 'lighter';
  for (const L of LEVELS) {
    L.x.clearRect(0, 0, L.c.width, L.c.height); L.x.filter = `blur(${L.b}px)`; L.x.drawImage(cGlow, 0, 0, L.c.width, L.c.height); L.x.filter = 'none';
    X.globalAlpha = L.w; X.drawImage(L.c, 0, 0, W, H);
  }
  X.globalAlpha = 1; X.drawImage(cBeam, 0, 0); X.drawImage(cUi, 0, 0); X.drawImage(cHot, 0, 0); X.drawImage(cAmb, 0, 0);
  X.globalCompositeOperation = 'source-over'; X.drawImage(cVig, 0, 0);
}

// ───────────────────────── drawing primitives ─────────────────────────
function line(c, pts, color, a, w, dash) {
  if (pts.length < 2 || a <= 0) return;
  c.save(); c.globalAlpha = clamp(a); c.strokeStyle = color; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; if (dash) c.setLineDash(dash);
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); c.restore();
}
function dot(c, x, y, r, color, a = 1) { if (a <= 0 || r <= 0) return; c.save(); c.globalAlpha = clamp(a); c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.restore(); }
function ring(c, x, y, r, color, a = 1, w = 3) { if (a <= 0) return; c.save(); c.globalAlpha = clamp(a); c.strokeStyle = color; c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); c.restore(); }
function text(c, s, x, y, font, color, a = 1, align = 'left') { if (a <= 0) return; c.save(); c.globalAlpha = clamp(a); c.font = font; c.fillStyle = color; c.textAlign = align; c.fillText(s, x, y); c.restore(); }
function tw(s, font) { X.font = font; return X.measureText(s).width; }
function rect(c, x0, y0, x1, y1, color, a, w = 1.6) { line(c, [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]], color, a, w); }
// text written by the beam: a clip sweeps left → right with a white-hot writing point, then a flash
function written(t, t0, t1, s, x, y, font, color = COL.ui, a = 1, layer = UI) {
  if (t < t0 || a <= 0) return 0;
  const w = tw(s, font), p = seg(t, t0, t1), px = parseFloat(font.match(/(\d+)px/)[1]);
  layer.save(); layer.beginPath(); layer.rect(x - 4, y - px * 1.2, w * p + 6, px * 1.6); layer.clip(); text(layer, s, x, y, font, color, a); layer.restore();
  if (p < 1) dot(HOT, x + w * p, y - px * .32 + Math.sin(t * 90) * px * .18, 4.5, COL.hot, a);
  const f = flash(t, t1, .4); if (f > 0) text(HOT, s, x, y, font, COL.hot, f * .8 * a);
  return p;
}
function graticule(a) {
  if (a <= 0) return;
  for (let i = 1; i < 10; i++) { const x = G.x0 + 96 * i; line(UI, [[x, G.y0], [x, G.y1]], COL.ui, .16 * a, 1.2, [2, 7]); }
  for (let i = 1; i < 8; i++) { const y = G.y0 + 96 * i; line(UI, [[G.x0, y], [G.x1, y]], COL.ui, .16 * a, 1.2, [2, 7]); }
  rect(UI, G.x0, G.y0, G.x1, G.y1, COL.ui, .42 * a);
}

// ───────────────────────── EP00 · the whole Transformer, measured on a real LLM ─────────────────────────
// Colour = role, kept for the whole film: green = tokens and the residual stream, cyan = attention, amber = feed-forward, white-hot = output.
const CY = '#5CE1FF';
const LX = [320, 455, 590, 725, 860], LT = 560, LB = 1220, PILL_Y = 1272;        // five lanes of the residual stream
const TB = { x0: 84, y0: 562, cols: 3, rows: 18, s: 37 };                         // the embedding table, drawn as cells
const ROWS = [4, 10, 2, 13, 3];                                                    // rows lit for The, capital, of, France, is (ordered like the ids, not to scale)
let DATA = null, TL = null, TEXTSET = [], RO = null;
const pct = (v, d = 1) => (100 * v).toFixed(d) + '%';
const vis = s => s.replace(/\n/g, '\\n');                                         // JetBrains Mono has no ⏎: show a newline token as \n

function pill(L, s, cx, y, font, color, a = 1, padX = 14, h = 46, w0) {
  if (a <= 0) return 0;
  const w = w0 ?? tw(s, font) + padX * 2;
  L.save(); L.globalAlpha = clamp(a) * .9; L.strokeStyle = color; L.lineWidth = 2.5; L.beginPath(); L.roundRect(cx - w / 2, y - h * .7, w, h, h / 2); L.stroke(); L.restore();
  text(L, s, cx, y, font, color, a, 'center'); return w;
}
function rbox(L, x0, y0, x1, y1, color, a, lw = 3, r = 14) { if (a <= 0) return; L.save(); L.globalAlpha = clamp(a); L.strokeStyle = color; L.lineWidth = lw; L.beginPath(); L.roundRect(x0, y0, x1 - x0, y1 - y0, r); L.stroke(); L.restore(); }
function fillRect(L, x0, y0, x1, y1, color, a) { if (a <= 0) return; L.save(); L.globalAlpha = clamp(a); L.fillStyle = color; L.fillRect(x0, y0, x1 - x0, y1 - y0); L.restore(); }
function curve(L, x0, y0, cx, cy, x1, y1, color, a, w, p = 1) {
  const pts = []; for (let i = 0; i <= 40 * p; i++) { const u = i / 40; pts.push([(1 - u) ** 2 * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) ** 2 * y0 + 2 * (1 - u) * u * cy + u * u * y1]); }
  line(L, pts, color, a, w);
}
function cellGrid(L, x0, y0, cols, rows, s, color, a, lit) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const on = lit && lit.has(r);
    L.save(); L.globalAlpha = clamp(a) * (on ? 1 : .28 + .32 * (((r * 7 + c * 3) % 5) / 4)); L.strokeStyle = on ? COL.hot : color; L.lineWidth = on ? 2.4 : 1.5;
    L.beginPath(); L.roundRect(x0 + c * s, y0 + r * s, s - 6, s - 6, 5); L.stroke(); L.restore();
  }
}
const rowY = r => TB.y0 + r * TB.s + (TB.s - 6) / 2;

// ───────────────────────── HUD: stop chips, progress, formula anchor, readout, karaoke caption ─────────────────────────
const STOPS = ['1 TOKENS', '2 VECTORS', '3 BLOCK ×24', '4 NEXT WORD'];
function chipTimes() { const M = TL.marks; return [0, 1, 2, 3].map(k => M.road + .35 + .5 * k); }
function activeStop(t) {
  const M = TL.marks;
  if (t >= M.recap) return [M.rTok, M.rVec, M.rBlk, M.rWord].filter(x => t >= x).length - 1;
  if (t >= M.stop4) return 3; if (t >= M.stop3) return 2; if (t >= M.stop2) return 1; if (t >= M.stop1) return 0;
  if (t >= M.road) return chipTimes().filter(x => t >= x).length - 1;
  return -1;
}
function chips(t) {
  const M = TL.marks, ct = chipTimes(), act = activeStop(t), all = t >= M.recap;
  let x = 72; const f = F.mono(24, 700);
  STOPS.forEach((s, k) => {
    const w = tw(s, f) + 32, a = seg(t, ct[k], ct[k] + .2);
    const on = all ? k <= act : k === act;
    if (a > 0) { if (on) pill(AMB, s, x + w / 2, 214, f, COL.amber, a, 16, 44, w); else pill(UI, s, x + w / 2, 214, f, COL.ui, .55 * a, 16, 44, w); }
    const fl = flash(t, all ? [M.rTok, M.rVec, M.rBlk, M.rWord][k] : [M.stop1, M.stop2, M.stop3, M.stop4][k], .5);
    if (fl > 0 && a > 0) text(HOT, s, x + w / 2, 214, f, COL.hot, fl * .8, 'center');
    x += w + 10;
  });
  line(UI, [[72, 252], [1008, 252]], COL.ui, .22, 4);
  line(HOT, [[72, 252], [72 + 936 * clamp(t / TL.dur), 252]], COL.hot, .85, 4);
}
function anchor(t) {
  const M = TL.marks;
  const S = [
    [0, [['one block of a real LLM: Qwen2.5-0.5B', F.mono(30, 600), COL.ui]]],
    [M.road, [['text → tokens → vectors → 24 blocks → next word', F.mono(27, 600), COL.ui]]],
    [M.stop1, [['text  →  token ids', F.ital(48), COL.ui]]],
    [M.stop2, [['x = E[id]', F.ital(48), COL.ui], ['E: 151,936 rows × 896', F.mono(30), COL.ui]]],
    [M.stop3, [['x ← x + Attn(Norm(x))', F.ital(48), CY], ['x ← x + FFN(Norm(x))', F.ital(48), COL.amber]]],
    [M.stop4, [['p = softmax(E · x)', F.ital(48), COL.hot]]],
    [M.strange, [['guess after block k = softmax(E · Norm(x))', F.ital(40), COL.hot]]],
    [M.recap, [['text → tokens → vectors → 24 blocks → next word', F.mono(27, 600), COL.ui]]],
  ];
  let k = 0; for (let i = 0; i < S.length; i++) if (t >= S[i][0]) k = i;
  const [t0, rows] = S[k];
  rows.forEach(([s, f, c], i) => {
    const y = 336 + i * 60, L = c === COL.amber ? AMB : UI;
    written(t, t0 + .05 + i * .25, t0 + .65 + i * .25, s, 72, y, f, c, 1, L);
  });
  TEXTSET.push({ id: 'anchor', text: rows.map(r => r[0]).join(' / '), x0: 72, y0: 296, x1: 1000, y1: 420, pass: true });
}
function readout(t) {
  if (!RO) return;
  const [s, c, f0] = RO, L = c === 'amber' ? AMB : UI, col = c === 'amber' ? COL.amber : c === 'cy' ? CY : c === 'hot' ? COL.hot : COL.ui;
  text(L, s, 72, 458, F.mono(30, 600), col, .95);
  if (f0 != null) { const f = flash(t, f0, .5); if (f > 0) text(HOT, s, 72, 458, F.mono(30, 600), COL.hot, f * .7); }
  TEXTSET.push({ id: 'readout', text: s, x0: 72, y0: 430, x1: 72 + tw(s, F.mono(30, 600)), y1: 466 });
}
function cueAt(t) { for (const c of TL.cues) if (t >= c.t0 && t < c.t1) return [c, clamp(Math.min((t - c.t0) / .14, (c.t1 - t) / .14))]; return [null, 0]; }
function caption(t) {
  const [c, a] = cueAt(t); if (!c || a <= 0) return;
  const f = F.serif(50, 600), y0 = 1418, lh = 62, maxw = 900;
  let cur = -1; c.w.forEach(([, wt], i) => { if (t >= wt) cur = i; });
  let x = 98, y = y0, n = 1;
  const pos = c.w.map(([s]) => { const ww = tw(s, f), sp = tw(' ', f); if (x + ww > 98 + maxw && x > 98) { x = 98; y += lh; n++; } const p = [x, y]; x += ww + sp; return p; });
  line(UI, [[74, y0 - 42], [74, y0 + (n - 1) * lh + 12]], COL.ui, .8 * a, 3);
  c.w.forEach(([s], i) => {
    const [px, py] = pos[i];
    if (i === cur) text(AMB, s, px, py, f, COL.amber, a); else text(UI, s, px, py, f, COL.ui, a * (i < cur ? 1 : .38));
  });
  TEXTSET.push({ id: 'cap', text: c.text, x0: 74, y0: y0 - 42, x1: 1000, y1: y0 + (n - 1) * lh + 14 });
}

// ───────────────────────── scene: the hook, 1.8M vs 13.1M ─────────────────────────
function hookScene(t, a) {
  if (a <= 0) return; const M = TL.marks, P = DATA.params, base = 1180, H = 560;
  const ha = eo(seg(t, M.attnBar + .2, M.attnBar + .8)) * H * P.attn / P.ffn, hf = eo(seg(t, M.ffnBar, M.ffnBar + 1.1)) * H;
  const bar = (x0, x1, h, c, L, name, n, t0) => {
    const g = seg(t, t0, t0 + .3); if (g <= 0) return;
    fillRect(L, x0, base - h, x1, base, c, .28 * a); rbox(L, x0, base - h, x1, base, c, a * g, 3, 8);
    text(L, name, (x0 + x1) / 2, base - h - 62, F.mono(30, 700), c, a * g, 'center');
    text(L, fmtN(n * clamp(h / Math.max(1e-6, (n === P.ffn ? H : H * P.attn / P.ffn)))), (x0 + x1) / 2, base - h - 22, F.mono(28), c, a * g, 'center');
  };
  line(UI, [[160, base], [920, base]], COL.ui, .5 * a, 2);
  text(UI, 'weights in one block', 540, base + 50, F.mono(28), COL.ui, .75 * a, 'center');
  bar(170, 370, ha, CY, UI, 'attention', P.attn, M.attnBar + .2);
  bar(450, 650, hf, COL.amber, AMB, 'feed-forward', P.ffn, M.ffnBar);
  const s = seg(t, M.seven - .1, M.seven + .2);
  if (s > 0) {
    line(AMB, [[670, base - H * P.attn / P.ffn], [700, base - H * P.attn / P.ffn], [700, base - H], [670, base - H]], COL.amber, a * s, 3);
    text(AMB, '×' + (P.ffn / P.attn).toFixed(1), 1000, base - H / 2 + 40, F.mono(120, 700), COL.amber, a * s, 'right');
    const f = flash(t, M.seven, .5); if (f > 0) text(HOT, '×' + (P.ffn / P.attn).toFixed(1), 1000, base - H / 2 + 40, F.mono(120, 700), COL.hot, f * a, 'right');
    TEXTSET.push({ id: 'x7', text: '×7.1', x0: 760, y0: base - H / 2 - 50, x1: 940, y1: base - H / 2 + 50 });
  }
}

// ───────────────────────── schematic: the four stops (roadmap and recap) ─────────────────────────
function schematic(t, a, times) {
  if (a <= 0) return;
  const y = [1180, 1000, 800, 610], on = times.map(x => seg(t, x, x + .25));
  for (const [ya, yb] of [[1150, 1080], [935, 860], [740, 640]]) line(UI, [[540, ya], [540, yb]], COL.ui, .4 * a, 2);
  for (let k = 0; k < 3; k++) { const yy = [1086, 866, 646][k]; line(UI, [[528, yy + 8], [540, yy - 6], [552, yy + 8]], COL.ui, .5 * a * on[k + 1], 2.5); }
  pill(UI, 'The capital of France is', 540, y[0], F.mono(30, 600), COL.ui, a * (.3 + .7 * on[0]), 18, 52);
  cellGrid(UI, 540 - 120, y[1] - 60, 8, 3, 30, COL.ui, a * (.3 + .7 * on[1]));
  text(UI, '151,936 × 896', 540, y[1] + 70, F.mono(24), COL.ui, .8 * a * on[1], 'center');
  rbox(BEAM, 380, y[2] - 70, 700, y[2] + 50, COL.ui, a * (.3 + .7 * on[2]), 2.5, 16);
  text(UI, 'attention', 540, y[2] + 20, F.mono(30, 700), CY, a * (.3 + .7 * on[2]), 'center');
  text(AMB, 'feed-forward', 540, y[2] - 26, F.mono(30, 700), COL.amber, a * (.3 + .7 * on[2]), 'center');
  text(AMB, '×24', 720, y[2] - 6, F.mono(44, 700), COL.amber, a * on[2]);
  pill(HOT, 'Paris  30%', 540, y[3], F.mono(32, 700), COL.hot, a * (.3 + .7 * on[3]), 20, 56);
  times.forEach((x, k) => { const f = flash(t, x, .45); if (f > 0) dot(HOT, 540, y[k] - (k === 1 ? 10 : 0), 8, COL.hot, f * a); });
}

// ───────────────────────── stop 1–2: the sentence, its token pills and ids, the table, the vectors ─────────────────────────
function pillsLayer(t, a) {
  if (a <= 0) return; const M = TL.marks, toks = DATA.tokens.map(s => s.trim());
  const fS = F.serif(72), sentence = DATA.prompt, sx = (W - tw(sentence, fS)) / 2;
  if (t < M.five + .05) {                                         // the sentence, written by the beam
    written(t, M.stop1 + .3, M.letters, sentence, sx, 880, fS, COL.ui, a);

  ev(M.attnBar + .2, 'rise', { d: .6, f0: 300, f1: 420 }); ev(M.ffnBar, 'rise', { d: 1.1, f0: 200, f1: 900 }); ev(M.seven, 'lock');
  chipTimes().forEach((x, k) => ev(x, 'chip', { k }));
  ev(M.road, 'music_on');
  for (const [x, k] of [[M.stop1, 0], [M.stop2, 1], [M.stop3, 2], [M.stop4, 3]]) ev(x, 'stop', { k });

  ev(M.five, 'split'); for (let i = 0; i < 5; i++) ev(M.five + .4 + i * .08, 'blip', { f: 1800 + 200 * i, v: .5 });
  for (let i = 0; i < 5; i++) ev(M.picks + .35 + i * .18, 'cursor', { f: 2000 + 150 * i });
  ev(M.rows, 'whoosh', { d: 1.0 }); ev(M.n896, 'readout'); ev(M.quarter, 'readout');
  ev(M.lanes, 'flow', { d: M.stop4 - M.lanes });
  ev(M.attn, 'band'); for (let j = 0; j < 4; j++) ev(M.look + j * .12, 'blip', { f: 2600 - 200 * j, v: .45 }); ev(M.france, 'ping', { m: 81 });
  for (let i = 0; i < 5; i++) ev(M.added1 + i * .05, 'add', { p: (i - 2) / 3 });
  ev(M.ffn, 'band'); ev(M.widen, 'rise', { d: .8, f0: 300, f1: 700 }); ev(M.back, 'rise', { d: .5, f0: 700, f1: 300 });
  for (let i = 0; i < 5; i++) ev(M.added2 + i * .05, 'add', { p: (i - 2) / 3 });
  ev(M.oneblock, 'readout');
  for (let k = 0; k < 24; k++) ev(M.stack0 + .35 + (M.stack1 - M.stack0 - .35) * k / 23, 'slab', { k });
  ev(M.wq, 'seg', { m: 74 }); ev(M.wt, 'seg', { m: 77 }); ev(M.wa, 'seg', { m: 81 });
  ev(M.scored, 'scan', { d: M.everyrow + 1.4 - M.scored });
  ev(M.softmax + .3, 'rise', { d: .9, f0: 400, f1: 800 }); ev(M.paris, 'lock');
  ev(M.strange, 'hush'); ev(M.lens0, 'trace', { d: M.nowhere + .6 - M.lens0 }); ev(M.b22, 'jump'); ev(M.p28, 'cursor', { f: 2400 });
  for (const x of [M.rTok, M.rVec, M.rBlk, M.rWord]) ev(x, 'chip', { k: 0 });
  ev(M.rTr, 'lock');
  for (let i = 0; i < 4; i++) ev(M.cta + .1 + i * .15, 'tick', { v: .7 });
  ticks('Follow to go deeper', M.follow, M.follow + .7, F.ital(76));
  ticks('Labs for every episode → link in bio', M.follow + .9, M.follow + 1.8, F.mono(32, 600), .4);
  return E.sort((p, q) => p.t - q.t);
}

function watch() {
  document.body.classList.add('fit');
  const cv = document.getElementById('c'), box = document.getElementById('play'), btn = document.getElementById('playBtn');
  const au = new Audio('audio.m4a'); au.preload = 'auto';
  let silent = false, t0 = 0, pos = 0, running = false;
  au.addEventListener('error', () => { silent = true; });
  const now = () => silent ? pos + (performance.now() - t0) / 1000 : au.currentTime;
  const frame = () => {
    if (!running) return;
    const t = now();
    if (t >= TL.dur || (!silent && au.ended)) { stop('↻ Watch again'); pos = 0; render(TL.dur - .01); return; }
    render(t); requestAnimationFrame(frame);
  };
  const start = () => {
    box.hidden = true; running = true;
    if (au.ended || au.currentTime >= TL.dur - .05) au.currentTime = 0;
    if (silent) { t0 = performance.now(); requestAnimationFrame(frame); return; }
    au.play().then(() => requestAnimationFrame(frame)).catch(() => { silent = true; t0 = performance.now(); requestAnimationFrame(frame); });
  };
  const stop = label => { if (silent) pos = now(); else au.pause(); running = false; btn.textContent = label; box.hidden = false; };
  btn.onclick = start;
  cv.addEventListener('click', () => running ? stop('▶ Resume') : start());
  render(POSTER_T); box.hidden = false; btn.focus({ preventScroll: true });
}
const POSTER_T = 7.6;
