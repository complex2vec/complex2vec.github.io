<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformer Playground · C2V Foundry</title>
<meta name="description" content="A whole Transformer in 3D, running live in your browser. Click any layer to open it, flip its switches and watch the prediction change.">
<meta property="og:title" content="Transformer Playground · C2V Foundry">
<meta property="og:description" content="Open a real (tiny) Transformer layer by layer: tokens, embedding, attention heads, feed-forward, residual stream.">
<meta name="theme-color" content="#010402">
<style>
@font-face { font-family: STIX; src: url(fonts/STIXTwoText.ttf); font-weight: 400 700; }
@font-face { font-family: STIX; src: url(fonts/STIXTwoText-Italic.ttf); font-style: italic; font-weight: 400 700; }
@font-face { font-family: JBM; src: url(fonts/JetBrainsMono.ttf); font-weight: 100 800; }
:root { --bg: #010402; --panel: #030b06; --amb: #0B2412; --beam: #4DFF88; --ui: #8DFFB0; --hot: #E6FFEC; --amber: #FFB547; --cyan: #5CE1FF; --neg: #FF5C8A; --line: #8DFFB026; --dim: #8DFFB099; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ui); font: 14px/1.45 JBM, ui-monospace, monospace; }
body { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
b.c { color: var(--cyan); } b.a { color: var(--amber); }

/* header */
header { display: flex; align-items: center; gap: 10px 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { color: var(--beam); text-decoration: none; font-weight: 700; letter-spacing: .02em; }
.title { font-family: STIX, serif; font-size: 20px; color: var(--hot); }
#arch { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chip:hover { border-color: var(--beam); }
.tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
.tag.ok { background: #4DFF8822; color: var(--beam); } .tag.warn { background: #FFB54722; color: var(--amber); }
#score { display: flex; gap: 10px; align-items: center; margin-left: auto; }
.sl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.sc { display: grid; grid-template-columns: auto 54px auto; gap: 6px; align-items: center; font-size: 12px; }
.sc i { height: 6px; background: linear-gradient(90deg, var(--beam) calc(var(--v) * 100%), #4DFF8822 0); border-radius: 3px; }
.sc b { min-width: 38px; text-align: right; color: var(--hot); } .sc b.down { color: var(--neg); } .sc b.up { color: var(--beam); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions button, .btn { border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font-size: 12px; white-space: nowrap; }
.actions button:hover, .btn:hover { border-color: var(--beam); color: var(--hot); }
#btnPlay { background: var(--beam); color: var(--bg); border-color: var(--beam); font-weight: 700; }

/* main */
main { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
#stage { position: relative; min-height: 0; overflow: hidden; }
#stage canvas { display: block; }
.labels { position: absolute; inset: 0; z-index: 1; }
#tip { position: absolute; pointer-events: none; background: #010402e6; border: 1px solid var(--line); padding: 3px 8px; font-size: 12px; border-radius: 4px; z-index: 5; white-space: nowrap; }
#narr { z-index: 4; position: absolute; left: 50%; top: 14px; transform: translateX(-50%) translateY(-10px); max-width: min(92%, 760px); padding: 8px 14px; background: #010402e6; border: 1px solid var(--beam); border-radius: 6px; color: var(--hot); font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; text-align: center; }
#narr.on { opacity: 1; transform: translateX(-50%); }
#busy { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--amber); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--dim); pointer-events: none; }

/* 3D labels */
.lbl { font-size: 11px; color: var(--ui); white-space: nowrap; pointer-events: none; text-shadow: 0 0 6px #010402, 0 0 2px #010402; }
.lbl.clk { pointer-events: auto; cursor: pointer; }
.lbl.clk:hover { color: var(--hot); }
.lbl.tok { display: grid; justify-items: center; font-size: 15px; color: var(--hot); }
.lbl.tok i { font-size: 9px; color: var(--dim); font-style: normal; }
.lbl.tok.on b { color: var(--bg); background: var(--beam); padding: 0 6px; border-radius: 3px; }
.lbl.side { text-align: right; font-size: 12px; }
.lbl.side .in { transform: translateX(-50%); }
.lbl.side span { display: block; font-size: 10px; color: var(--dim); }
.lbl.side.small { font-size: 10px; color: var(--dim); }
.lbl.side.amber { color: var(--amber); }
.lbl.side.dim { color: var(--dim); }
.lbl.blk { font-family: STIX, serif; font-size: 18px; color: var(--beam); }
.lbl.head { color: var(--cyan); font-size: 10px; }
.lbl.att { color: var(--cyan); font-size: 11px; background: #010402cc; padding: 0 4px; border-radius: 3px; }
.lbl.att i { color: var(--hot); font-style: normal; }
.lbl.att .ctx { color: var(--dim); }
.lbl.pred { color: var(--dim); font-size: 11px; }
.lbl.pred i { font-style: normal; font-size: 9px; margin-left: 3px; }
.lbl.card { background: #010402e6; border: 1px solid #E6FFEC55; border-radius: 6px; padding: 6px 8px; width: 190px; white-space: normal; }
.lbl.card .hd { font-size: 10px; color: var(--dim); margin-bottom: 3px; }
.lbl.card .row { display: grid; grid-template-columns: 64px 1fr 44px; gap: 6px; align-items: center; font-size: 12px; color: var(--hot); }
.lbl.card .row b { height: 7px; background: var(--hot); border-radius: 2px; box-shadow: 0 0 8px #E6FFEC88; }
.lbl.card .row em { font-style: normal; text-align: right; color: var(--ui); font-size: 11px; }

/* inspector */
#insp { border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 16px 40px; background: var(--panel); }
#insp h2 { font-family: STIX, serif; font-weight: 600; font-size: 22px; color: var(--hot); margin: 6px 0 8px; line-height: 1.15; }
#insp h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 18px 0 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.crumbs { display: flex; gap: 4px; font-size: 11px; }
.crumbs button { color: var(--dim); } .crumbs button:hover { color: var(--hot); }
.crumbs button + button::before { content: '› '; }
.guide { color: var(--ui); font-size: 13px; }
.guide b { color: var(--hot); }
.formula { font-family: STIX, serif; font-size: 18px; color: var(--hot); background: #4DFF880d; border-left: 2px solid var(--beam); padding: 6px 10px; margin: 10px 0; }
.try { border: 1px dashed #FFB54766; border-radius: 6px; padding: 6px 10px; margin-top: 14px; font-size: 12px; }
.try > b { color: var(--amber); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
.try ul { margin: 4px 0 0; padding-left: 16px; } .try li b { color: var(--hot); }
.sub { font-size: 11px; color: var(--dim); margin: 12px 0 4px; }
.note { font-size: 11px; color: var(--dim); margin: 6px 0; }
.field { margin: 8px 0; }
.field > label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.field.sl input { width: 100%; accent-color: var(--beam); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; font-size: 12px; position: relative; }
.seg button.on { background: var(--beam); color: var(--bg); border-color: var(--beam); font-weight: 700; }
.seg button.dot::after, .dotk { content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
.dotk { position: relative; display: inline-block; top: 0; right: 0; }
.tog { display: flex; align-items: flex-start; gap: 10px; margin: 8px 0; cursor: pointer; font-size: 13px; }
.tog input { display: none; }
.tog .sw { flex: none; width: 30px; height: 16px; border-radius: 8px; background: #8DFFB022; position: relative; margin-top: 2px; transition: .15s; }
.tog .sw::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); transition: .15s; }
.tog.on .sw { background: var(--beam); } .tog.on .sw::after { left: 16px; background: var(--bg); }
.tog small { display: block; font-size: 10px; color: var(--dim); }
.pbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin: 12px 0 4px; gap: 1px; }
.plegend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--dim); align-items: center; }
.plegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.plegend b { margin-left: auto; color: var(--hot); }
.grid { display: grid; gap: 3px; font-size: 11px; margin: 4px 0 10px; }
.gh { color: var(--dim); text-align: center; align-self: center; }
.gc { border-radius: 4px; padding: 4px 2px; text-align: center; background: color-mix(in srgb, var(--beam) calc(var(--v) * var(--v) * 55%), #0B2412); color: var(--hot); border: 1px solid transparent; line-height: 1.15; }
.gc b { display: block; font-size: 12px; } .gc small { font-size: 9px; opacity: .75; }
.gc.on { border-color: var(--hot); box-shadow: 0 0 10px #E6FFEC55; } .gc:hover { border-color: var(--ui); }
.gc.na { background: none; color: #8DFFB044; }
.heatwrap { overflow-x: auto; margin: 4px 0; }
canvas.heat { display: block; cursor: crosshair; }
.heads { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 8px; }
.hcard { border: 1px solid #5CE1FF33; border-radius: 6px; padding: 6px; }
.hcard.muted { opacity: .45; }
.hh { color: var(--cyan); font-weight: 700; display: flex; justify-content: space-between; width: 100%; font-size: 12px; margin-bottom: 4px; }
.hh small { color: var(--dim); font-weight: 400; }
.bars .br { display: grid; grid-template-columns: 70px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; margin: 3px 0; }
.bars i { height: 8px; border-radius: 2px; background: linear-gradient(90deg, var(--c) calc(var(--v) * 100%), #8DFFB014 0); }
.bars em { font-style: normal; text-align: right; color: var(--hot); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; margin: 6px 0; }
.kv span { color: var(--dim); } .kv b { color: var(--hot); font-weight: 400; }
.vstrip { display: flex; height: 16px; border: 1px solid var(--line); }
.vstrip i { flex: 1; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.tile { border-radius: 6px; padding: 10px; text-align: left; font-weight: 700; }
.tile small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
.tile.c { border: 1px solid var(--cyan); color: var(--cyan); } .tile.a { border: 1px solid var(--amber); color: var(--amber); }
.lens { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
.lens .hd { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
.lr { display: grid; grid-template-columns: 96px 70px 48px 1fr; gap: 6px; align-items: center; font-size: 12px; margin: 2px 0; }
.lr span { color: var(--dim); } .lr b { color: var(--hot); font-weight: 400; } .lr em { font-style: normal; font-size: 11px; }
.lr i { height: 6px; border-radius: 2px; background: linear-gradient(90deg, var(--hot) calc(var(--v) * 100%), #E6FFEC14 0); }
.lens small { font-size: 10px; color: var(--dim); }
.changes { margin-top: 22px; border: 1px solid #FFB54755; border-radius: 6px; padding: 8px; }
.changes.none { border-color: var(--line); font-size: 11px; color: var(--dim); }
.changes .hd { display: flex; justify-content: space-between; font-size: 11px; color: var(--amber); margin-bottom: 6px; }
.changes .hd button { color: var(--amber); text-decoration: underline; }
.cg { display: inline-flex; gap: 6px; align-items: center; border: 1px solid #FFB54755; border-radius: 999px; padding: 1px 8px; font-size: 11px; margin: 2px; color: var(--amber); }
.cg i { font-style: normal; }

/* footer: tokens + next word */
footer { border-top: 1px solid var(--line); padding: 8px 14px 10px; display: grid; gap: 6px; }
#tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tchip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tchip.on { border-color: var(--beam); box-shadow: 0 0 10px #4DFF8844; }
.tchip .w { padding: 3px 8px; color: var(--hot); font-size: 14px; }
.tchip .f, .tchip .x { padding: 0 6px; color: var(--dim); font-size: 11px; border-left: 1px solid var(--line); }
.tchip.on .f { color: var(--beam); }
.tchip button:hover { background: #4DFF8818; }
.tadd { border: 1px dashed var(--line); border-radius: 6px; padding: 3px 10px; color: var(--dim); }
#presets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.pre { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 11px; color: var(--dim); }
.pre i { font-style: normal; color: var(--amber); margin-right: 6px; } .pre.on { color: var(--hot); border-color: var(--ui); }
#next { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nl { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.nx { display: grid; grid-template-columns: auto 40px auto; gap: 6px; align-items: center; border: 1px solid #E6FFEC33; border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.nx b { color: var(--hot); } .nx em { font-style: normal; font-size: 11px; }
.nx i { height: 5px; border-radius: 2px; background: linear-gradient(90deg, var(--hot) calc(var(--v) * 100%), #E6FFEC1a 0); }
.nx:hover:not(:disabled) { border-color: var(--hot); } .nx:disabled { opacity: .35; cursor: default; }
.nx.go { display: block; color: var(--beam); border-color: var(--beam); }
.picker { position: fixed; z-index: 20; background: #020a05; border: 1px solid var(--beam); border-radius: 8px; padding: 8px; max-height: 50vh; overflow: auto; box-shadow: 0 10px 40px #000; }
.picker .grp { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 4px 0; }
.picker .grp span { width: 64px; font-size: 10px; color: var(--amber); text-transform: uppercase; }
.picker button { border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; font-size: 12px; color: var(--hot); }
.picker button:hover { border-color: var(--beam); background: #4DFF8818; }

/* tour, missions, toast */
#tourcard { position: absolute; bottom: 30px; left: 14px; width: min(380px, calc(100% - 28px)); background: #010402ee; border: 1px solid var(--beam); border-radius: 8px; padding: 12px 14px; z-index: 6; box-shadow: 0 0 30px #4DFF8822; }
#tourcard .tt { font-family: STIX, serif; font-size: 20px; color: var(--hot); display: flex; justify-content: space-between; align-items: baseline; }
#tourcard .tt span { font: 11px JBM, monospace; color: var(--dim); }
#tourcard p { font-size: 13px; margin: 6px 0 10px; } #tourcard p b { color: var(--hot); }
#tourcard .tb { display: flex; gap: 6px; } #tourcard .tb span { flex: 1; }
#tourcard .tb button { border: 1px solid var(--line); border-radius: 5px; padding: 3px 10px; font-size: 12px; }
#tourcard .tb .pri { background: var(--beam); color: var(--bg); border-color: var(--beam); font-weight: 700; }
#missions { position: absolute; top: 14px; right: 14px; width: min(340px, calc(100% - 28px)); max-height: calc(100% - 28px); overflow: auto; background: #010402ee; border: 1px solid var(--amber); border-radius: 8px; padding: 10px 14px; z-index: 6; }
#missions .hd { display: flex; justify-content: space-between; color: var(--amber); font-weight: 700; }
.ms { border-top: 1px solid var(--line); padding: 8px 0; font-size: 12px; }
.ms b { color: var(--hot); } .ms.ok b { color: var(--beam); } .ms p { margin: 4px 0 0; color: var(--ui); } .ms p b { color: var(--amber); }
.toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--beam); color: var(--bg); font-weight: 700; padding: 8px 16px; border-radius: 6px; z-index: 30; transition: .5s; box-shadow: 0 0 30px #4DFF8888; }
.toast.out { opacity: 0; transform: translateX(-50%) translateY(-10px); }

@media (max-width: 899px) {
  body { display: flex; flex-direction: column; height: auto; overflow-x: hidden; overflow-y: auto; }
  header { order: 0; }
  main { display: contents; }
  #stage { order: 1; }
  footer { order: 2; }
  #insp { order: 3; }
  #score { margin-left: 0; width: 100%; justify-content: space-between; }
  .sc { grid-template-columns: auto 18px auto; gap: 4px; font-size: 11px; }
  .sc b { min-width: 0; }
  .sl { display: none; }
  html, body { max-width: 100%; overflow-x: hidden; }
  #stage { height: 60svh; flex: none; }
  #insp { border-left: 0; border-top: 1px solid var(--line); }
  .title { font-size: 17px; }
  .lbl.side span { display: none; }
}
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

<body>
<header>
  <a class="brand" href="../">C2V Foundry</a><span class="title">Transformer Playground</span>
  <div id="arch"></div>
  <div id="score"></div>
  <div class="actions"><button id="btnTour">Guided tour</button><button id="btnMissions">Missions</button><button id="btnView" title="see the whole model">⟲ View</button><button id="btnPlay">▶ Run forward pass</button></div>
</header>
<main>
  <div id="stage">
    <div id="tip" hidden></div><div id="narr"></div><div id="busy" hidden>loading weights…</div>
    <div class="hint">drag: turn · scroll/pinch: zoom · right-drag: move · click a part to open it</div>
    <div id="tourcard" hidden></div>
    <div id="missions" hidden><div class="hd">Missions <button class="x">×</button></div><div class="list"></div></div>
  </div>
  <aside id="insp"></aside>
</main>
<footer>
  <div id="tokens"></div>
  <div id="presets"></div>
  <div id="next"></div>
</footer>
<script type="module" src="app.js"></script>
<script>if (!navigator.webdriver) { const s = document.createElement('script'); s.async = true; s.src = '//gc.zgo.at/count.js'; s.dataset.goatcounter = 'https://complex2vec.goatcounter.com/count'; document.head.append(s); }</script>
</body>
</html>
